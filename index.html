<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#A90E02">
<title>Kairos · Show Up Daily</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#FFFBEB;--bg2:#FFFDF4;--card:#FFFFFF;--card2:#FFF8DC;
  --text:#171208;--text2:#5E5228;--text3:#9A8748;--text4:#CBB877;
  --accent:#A90E02;--accent2:#D12A16;--accent-bg:#FCE4DE;--accent-dark:#7C0A01;
  --ink:#141210;--lemon:#FFFBD4;
  --warm:#C48A16;--warm-bg:#FFF3CE;--warm2:#E0A62A;
  --danger:#D6483B;--danger-bg:#FCEAE7;
  --border:#F0E4B4;--border2:#E3D390;
  --shadow:0 1px 3px rgba(90,45,0,.08),0 1px 2px rgba(90,45,0,.05);
  --shadow2:0 6px 18px rgba(140,10,0,.12),0 2px 6px rgba(90,45,0,.06);
  --radius:12px;--radius2:16px;
  --serif:'Anton',Impact,'Arial Narrow Bold',sans-serif;
  --display:'Anton',Impact,'Arial Narrow Bold',sans-serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px;-webkit-font-smoothing:antialiased}
#root{max-width:480px;margin:0 auto;padding:0 16px}

/* Desktop layout */
@media(min-width:768px){
  body{padding-bottom:0}
  #root{max-width:100%;padding:0}
  .app-shell{display:flex;min-height:100vh}
  .sidebar{width:240px;background:var(--card);border-right:1px solid var(--border);padding:20px 0;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:40}
  .sidebar .sb-logo{padding:16px 24px 20px;display:flex;align-items:center;gap:10px}
  .sidebar .sb-logo-icon{font-size:24px}
  .sidebar .sb-logo-text{font-family:var(--serif);font-size:20px;color:var(--text)}
  .sidebar .sb-user{padding:12px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);margin-bottom:12px;padding-bottom:16px}
  .sidebar .sb-user img{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);object-fit:cover}
  .sidebar .sb-user-info{flex:1}
  .sidebar .sb-user-name{font-size:13px;font-weight:600;color:var(--text)}
  .sidebar .sb-user-streak{font-size:11px;color:var(--warm);font-weight:600}
  .sidebar nav{flex:1;padding:0 12px}
  .sidebar nav a{display:flex;align-items:center;gap:12px;padding:11px 16px;text-decoration:none;color:var(--text2);font-size:13px;font-weight:600;border-radius:10px;margin-bottom:2px;transition:all .15s}
  .sidebar nav a:hover{background:var(--card2);color:var(--text)}
  .sidebar nav a.on{background:var(--accent-bg);color:var(--accent-dark)}
  .sidebar nav a .s-ico{font-size:18px;width:24px;text-align:center}
  .sidebar .sb-footer{padding:12px 24px;border-top:1px solid var(--border);margin-top:auto}
  .sidebar .sb-footer button{background:none;border:none;color:var(--text3);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);padding:6px 0}
  .sidebar .sb-footer button:hover{color:var(--text)}
  .main-area{margin-left:240px;flex:1;padding:24px 32px;max-width:960px}
  .main-area .hdr{display:none}
  .bnav{display:none!important}
  .login{max-width:480px;margin:0 auto}
  .onboard{max-width:540px;margin:0 auto}

  /* Dashboard 2-column */
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .dash-grid .dash-left,.dash-grid .dash-right{min-width:0}

  /* Wider cards on desktop */
  .card{padding:24px}

  /* Modal centered on desktop */
  .modal-overlay{align-items:center}
  .modal{border-radius:var(--radius2);max-width:520px}

  /* Page title for desktop */
  .page-title{font-family:var(--serif);font-size:26px;color:var(--text);margin-bottom:20px;font-weight:400;display:block}
}
@media(max-width:767px){
  .sidebar{display:none!important}
  .main-area{margin-left:0!important;padding:0 16px!important}
  .page-title{display:none}
  .dash-grid{display:block}
}

/* Cards */
.card{background:var(--card);border-radius:var(--radius2);padding:20px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-t{font-family:var(--sans);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;font-weight:700}
.card-warm{background:var(--warm-bg);border-color:#EDD8C4}
.card-accent{background:var(--accent-bg);border-color:#D1DBC6}

/* Buttons */
.btn{border:none;border-radius:10px;padding:12px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark)}
.btn-warm{background:var(--warm);color:#fff}
.btn-warm:hover{background:#B3845C}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:var(--card2);color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--border)}
.btn-full{width:100%;justify-content:center}
.btn-sm{padding:8px 14px;font-size:11px;border-radius:8px}

/* Inputs */
input,select,textarea{width:100%;font-size:14px;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;background:var(--card2);color:var(--text);font-family:var(--sans);transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;background:var(--card)}
textarea{resize:vertical;min-height:50px}
input::placeholder,textarea::placeholder{color:var(--text4)}
label{font-size:11px;color:var(--text3);font-weight:600;display:block;margin-bottom:4px;margin-top:14px;text-transform:uppercase;letter-spacing:.5px}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 24px;border-radius:var(--radius);font-size:13px;font-weight:600;z-index:1000;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.empty{color:var(--text4);font-size:13px;text-align:center;padding:24px}

/* Login */
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:30px;text-align:center}
.login-logo{font-size:42px;margin-bottom:4px}
.login h1{font-family:var(--serif);font-size:32px;color:var(--text);font-weight:400}
.login p{font-size:14px;color:var(--text3);margin:8px 0 36px;line-height:1.6}
.g-btn{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 28px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);color:var(--text);font-family:var(--sans);transition:all .15s}
.g-btn:hover{box-shadow:var(--shadow2);border-color:var(--border2)}
.g-btn img{width:20px;height:20px}
.feat{font-size:13px;color:var(--text3);padding:7px 0;text-align:left;display:flex;align-items:center;gap:8px}
.feat-icon{font-size:16px}

/* Onboarding */
.onboard{padding:20px 0;min-height:100vh}
.ob-title{font-family:var(--serif);font-size:26px;color:var(--text);margin-bottom:4px;font-weight:400}
.ob-sub{font-size:13px;color:var(--text3);margin-bottom:20px;line-height:1.5}
.ob-step{font-size:10px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}

/* Header */
.hdr{background:var(--card);border-radius:var(--radius2);padding:18px 20px;margin-top:12px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border);display:flex;align-items:center;gap:14px}
.av{width:42px;height:42px;border-radius:50%;border:2px solid var(--border);object-fit:cover}
.hdr .info{flex:1}
.hdr .lbl{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);font-weight:600}
.hdr .nm{font-family:var(--serif);font-size:20px;color:var(--text);margin-top:2px;font-weight:400}
.hdr .stk{font-size:12px;color:var(--warm);margin-top:3px;font-weight:600}
.so{background:var(--card2);border:1px solid var(--border);color:var(--text3);border-radius:8px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--sans)}
.so:hover{background:var(--border)}

/* Bottom Nav */
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:50;padding:4px 0 env(safe-area-inset-bottom,6px)}
.bnav a{flex:1;text-align:center;padding:6px 0;text-decoration:none;color:var(--text4);font-size:9px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .15s;font-family:var(--sans)}
.bnav a .ico{font-size:20px}
.bnav a.on{color:var(--accent)}

/* Day Navigator */
.dn{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.dn button{background:none;border:none;color:var(--accent);font-size:22px;cursor:pointer;padding:4px 12px;font-weight:600}
.dn button:hover{color:var(--accent-dark)}
.dn-label{font-family:var(--serif);font-size:16px;color:var(--text)}
.dn-sub{font-size:11px;color:var(--text3);margin-top:1px}

/* Tasks */
.rw{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);-webkit-tap-highlight-color:transparent}
.rw:last-child{border-bottom:none}
.ck{width:22px;height:22px;border:2px solid var(--border2);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin-top:2px;transition:all .15s;cursor:pointer}
.ck.on{background:var(--accent);border-color:var(--accent)}
.ck.ckmask{background:transparent;border-color:transparent;width:26px;height:26px;overflow:visible;margin-top:0}
.ck.ckmask svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.ck.ckmark{background:transparent;border-color:transparent;width:28px;height:28px;overflow:visible;margin-top:0}
.mark-em{display:inline-flex;align-items:center;justify-content:center;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.ck.ckmark .mark-em{font-size:23px}
.mark-pop{animation:markPop .55s cubic-bezier(.2,.8,.3,1.3) both;transform-style:preserve-3d}
@keyframes markPop{0%{transform:scale(0) rotateY(-170deg);opacity:0}55%{transform:scale(1.4) rotateY(20deg)}100%{transform:scale(1) rotateY(0);opacity:1}}
.mark-chip{font-size:22px;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--border);background:var(--card2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;transform-style:preserve-3d}
.mark-chip.on{border-color:var(--accent);background:var(--accent-bg);transform:scale(1.08)}
.tn{font-size:14px;font-weight:600;color:var(--text)}
.td2{font-size:11px;color:var(--text3);margin-top:3px;line-height:1.4}
.rw.done .tn{opacity:.4;text-decoration:line-through}
.rw.done .td2{opacity:.25}
.freq-tag{font-size:9px;color:var(--accent);background:var(--accent-bg);padding:2px 7px;border-radius:5px;font-weight:700;margin-left:6px}
.nb{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;background:var(--card2);border-radius:8px;border:1px solid var(--border)}
.nb span{font-size:11px;color:var(--text3);flex:1}
.nb input{width:54px;background:var(--card);border:1.5px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;padding:5px 8px;text-align:center}

/* Submit */
.sub-wrap{position:sticky;bottom:72px;z-index:10}
@media(min-width:768px){.sub-wrap{bottom:20px}}
.sub-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:16px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(169,14,2,.3);font-family:var(--sans);transition:all .15s}
.sub-btn:active{transform:scale(.97)}
.sub-btn.saved{background:var(--warm)}
.sub-btn:disabled{opacity:.5}

/* Day pills */
.day-pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.day-pill{padding:7px 11px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);color:var(--text3);background:var(--card2);user-select:none;transition:all .15s;font-family:var(--sans)}
.day-pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.day-pill:hover{border-color:var(--accent)}

/* Task management */
.task-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card2);border-radius:var(--radius);margin-bottom:8px;border:1px solid var(--border);transition:all .15s}
.task-item:hover{box-shadow:var(--shadow)}
.task-item .t-info{flex:1}
.task-item .t-name{font-size:14px;font-weight:600;color:var(--text)}
.task-item .t-meta{font-size:11px;color:var(--text3);margin-top:3px}
.task-item .t-days{font-size:10px;color:var(--accent);margin-top:2px;font-weight:600}
.task-item.archived{opacity:.45}
.task-actions{display:flex;gap:4px}
.task-actions button{background:none;border:1px solid transparent;font-size:15px;cursor:pointer;padding:6px;border-radius:8px;transition:all .15s}
.task-actions button:hover{background:var(--border);border-color:var(--border2)}

/* Calendar */
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cg .ch{font-size:10px;color:var(--text3);text-align:center;padding:4px;font-weight:600}
.cy{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;cursor:pointer;background:var(--card2);color:var(--text4);transition:all .15s;position:relative}
.cy:hover{background:var(--border)}
.cy.pf{background:var(--warm-bg);color:var(--text3);border:1.5px solid var(--warm2)}
.cy.pf .cy-mask{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px}
.cy.pf .cy-mask svg{width:64%;height:78%;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.cy.pf .cy-d{position:absolute;top:2px;right:4px;font-size:8px;font-weight:800;color:var(--text3)}
.cy.pt{background:var(--accent-bg);color:var(--accent-dark)}
.cy.now{outline:2px solid var(--warm);outline-offset:-1px}
.mn{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mn span{font-family:var(--serif);font-size:16px}
.mn button{background:none;border:none;color:var(--accent);font-size:18px;cursor:pointer;padding:4px 10px;font-weight:600}

/* Dashboard week grid */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week-day{background:var(--card2);border-radius:10px;padding:10px 4px;text-align:center;border:1px solid var(--border);transition:all .15s;cursor:pointer}
.week-day:hover{box-shadow:var(--shadow);border-color:var(--border2)}
.week-day.today{border-color:var(--accent);border-width:2px;background:var(--accent-bg)}
.week-day .wd-name{font-size:10px;font-weight:700;color:var(--text3)}
.week-day .wd-date{font-size:13px;font-weight:600;margin-top:2px;color:var(--text)}
.week-day .wd-count{font-size:9px;color:var(--accent);margin-top:4px;font-weight:700}

/* Stats */
.sb{background:var(--card2);border-radius:10px;padding:16px;text-align:center;border:1px solid var(--border)}
.sb .big{font-family:var(--serif);font-size:28px;font-weight:400}
.sb .sm{font-size:10px;color:var(--text3);margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}

/* Rewards */
.rew-banner{background:linear-gradient(135deg,#D12A16,#A90E02);border-radius:var(--radius2);padding:24px;margin-bottom:14px;text-align:center;color:#fff;box-shadow:0 4px 16px rgba(169,14,2,.25)}
.rew-code{background:rgba(255,255,255,.9);border-radius:10px;padding:12px;margin-top:12px;font-size:20px;font-weight:800;color:var(--text);letter-spacing:3px;font-family:monospace}
.pbar{background:var(--border);border-radius:10px;height:10px;margin-top:16px;overflow:hidden}
.pfill{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;border-radius:10px}
.ms{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.ms:last-child{border-bottom:none}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{font-size:10px;background:var(--card2);border-radius:var(--radius);padding:6px 12px;color:var(--text3);font-weight:600;border:1px solid var(--border)}
.badge.earned{background:var(--accent-bg);color:var(--accent-dark);border-color:#D1DBC6}
.badge.gold{background:linear-gradient(135deg,#D4A574,#C4956A);color:#fff;border-color:transparent}

/* Import */
.import-zone{border:2px dashed var(--border2);border-radius:var(--radius2);padding:32px;text-align:center;cursor:pointer;transition:all .2s;background:var(--card2)}
.import-zone:hover{border-color:var(--accent);background:var(--accent-bg)}
.import-zone.dragover{border-color:var(--accent);background:var(--accent-bg)}
.import-row{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card2);border-radius:10px;margin-bottom:8px;border:1px solid var(--border)}
.import-row .ir-name{flex:1;font-size:13px;font-weight:600}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(44,36,22,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:24px}
.modal-title{font-family:var(--serif);font-size:20px;font-weight:400;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text3);padding:4px}
.modal-close:hover{color:var(--text)}

/* Locked */
.locked-msg{background:var(--warm-bg);color:var(--warm);font-size:12px;padding:12px 16px;border-radius:10px;text-align:center;margin-bottom:14px;font-weight:600;border:1px solid #EDD8C4}

/* Quote */
.quote{text-align:center;font-family:var(--serif);font-size:14px;color:var(--text3);font-style:italic;margin:20px 0 24px;line-height:1.6}

/* Next week rows */
.nw-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;align-items:center}
.nw-row:last-child{border-bottom:none}
.nw-day{min-width:50px;font-weight:700;color:var(--accent);font-size:11px}
.nw-tasks{flex:1;color:var(--text2);line-height:1.4}
.nw-count{font-weight:700;color:var(--text);font-size:13px;background:var(--card2);padding:2px 8px;border-radius:6px}

/* Poster-style headings */
.login h1,.hdr .nm,.dn-label,.mn span,.page-title,.ob-title,.modal-title,.sb-logo-text{letter-spacing:.5px}
.sb .big{letter-spacing:.5px}

/* ===== SHOW UP ===== */
.su-hero{background:var(--accent);color:var(--lemon);border-radius:var(--radius2);padding:26px 22px 24px;text-align:center;box-shadow:var(--shadow2);position:relative;overflow:hidden;margin-bottom:14px}
.su-hero:before{content:"";position:absolute;top:-40px;right:-40px;width:150px;height:150px;background:rgba(255,251,212,.08);border-radius:50%}
.su-hero .su-kicker{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;font-weight:800;opacity:.9;position:relative}
.su-hero h2{font-family:var(--display);font-size:46px;line-height:.92;letter-spacing:1.5px;margin:6px 0 4px;text-transform:uppercase;position:relative}
.su-hero .su-date{font-size:12px;opacity:.9;font-weight:600;position:relative}
.su-flame{font-size:44px;margin:10px 0 2px;position:relative}
.su-streaknum{font-family:var(--display);font-size:40px;line-height:1;letter-spacing:1px;position:relative}

function getTasksForDate(ds){
  if(!UD||!UD.tasks)return[];var dt=mk(ds),dow=dt.getDay(),r=[];
  for(var i=0;i<UD.tasks.length;i++){var t=UD.tasks[i];if(t.archived)continue;
    if(t.days&&t.days.length>0){if(t.days.indexOf(dow)!==-1)r.push(t);continue;}
    if(t.freq==="daily"){r.push(t);continue;}
    if(t.freq==="weekly"&&dow===1){r.push(t);continue;}
    if(t.freq==="monthly"&&dt.getDate()===1){r.push(t);continue;}
    if(t.freq==="custom"&&t.startDate&&t.customDays){var s=mk(t.startDate),df=Math.round((dt-s)/864e5);if(df>=0&&df%t.customDays===0)r.push(t);}
  }return r;
}
function getAllTasksForDate(ds){
  if(!UD)return[];var dt=mk(ds),dow=dt.getDay(),all=(UD.tasks||[]).concat(UD.archivedTasks||[]),r=[];
  for(var i=0;i<all.length;i++){var t=all[i];
    if(t.days&&t.days.length>0){if(t.days.indexOf(dow)!==-1)r.push(t);continue;}
    if(t.freq==="daily"){r.push(t);continue;}
    if(t.freq==="weekly"&&dow===1){r.push(t);continue;}
    if(t.freq==="monthly"&&dt.getDate()===1){r.push(t);continue;}
    if(t.freq==="custom"&&t.startDate&&t.customDays){var s=mk(t.startDate),df=Math.round((dt-s)/864e5);if(df>=0&&df%t.customDays===0)r.push(t);}
  }return r;
}

// IMPORT
function handleImport(file,isOb){
  var reader=new FileReader();reader.onload=function(e){try{
    var d=new Uint8Array(e.target.result),wb=XLSX.read(d,{type:"array"});
    // Strategy: detect schedule format (sheets named Mon/Tue/etc with TIME,TASK,DESCRIPTION columns)
    var daySheetMap={Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6,Sun:0,Monday:1,Tuesday:2,Wednesday:3,Thursday:4,Friday:5,Saturday:6,Sunday:0};
    var foundTasks={};// key=taskName, value={name,desc,time,days:[]}
    var hasScheduleSheets=false;
    
    for(var si=0;si<wb.SheetNames.length;si++){
      var sn=wb.SheetNames[si];
      var dayNum=daySheetMap[sn];
      if(dayNum===undefined) continue;
      hasScheduleSheets=true;
      var ws=wb.Sheets[sn];
      if(!ws["!ref"]) continue;
      var rng=XLSX.utils.decode_range(ws["!ref"]);
      
      // Find header row (look for TIME or TASK in first 10 rows)
      var hdrRow=-1,colTime=-1,colTask=-1,colDesc=-1,colCat=-1;
      for(var r=0;r<=Math.min(rng.e.r,10);r++){
        for(var c=0;c<=rng.e.c;c++){
          var cell=ws[XLSX.utils.encode_cell({r:r,c:c})];
          if(!cell||!cell.v) continue;
          var v=String(cell.v).trim().toUpperCase();
          if(v==="TIME"){hdrRow=r;colTime=c;}
          if(v==="TASK"){hdrRow=r;colTask=c;}
          if(v==="DESCRIPTION"||v==="DETAILS"){colDesc=c;}
          if(v==="CATEGORY"){colCat=c;}
        }
        if(hdrRow>=0) break;
      }
      if(colTask===-1) colTask=1;// fallback column B
      if(colTime===-1) colTime=0;// fallback column A
      if(colDesc===-1) colDesc=2;// fallback column C
      
      // Read tasks from rows after header
      var startRow=(hdrRow>=0)?hdrRow+1:4;
      for(var r=startRow;r<=rng.e.r;r++){
        var taskCell=ws[XLSX.utils.encode_cell({r:r,c:colTask})];
        if(!taskCell||!taskCell.v) continue;
        var taskName=String(taskCell.v).trim();
        if(!taskName) continue;
        // Skip section headers (FIXED MORNING BLOCK, EVENING BLOCK, etc)
        var upper=taskName.toUpperCase();
        if(upper.indexOf("FIXED")===0||upper.indexOf("EVENING")===0||upper.indexOf("MORNING")===0) continue;
        // Skip non-task rows (merged cells with section titles)
        if(taskName.length>80) continue;
        
        var timeCell=ws[XLSX.utils.encode_cell({r:r,c:colTime})];
        var descCell=ws[XLSX.utils.encode_cell({r:r,c:colDesc})];
        var timeVal=timeCell&&timeCell.v?String(timeCell.v).trim():"";
        var descVal=descCell&&descCell.v?String(descCell.v).trim():"";
        
        // Deduplicate: same task name across days gets merged
        var key=taskName.replace(/\s+/g," ");
        if(!foundTasks[key]){
          foundTasks[key]={name:taskName,desc:descVal,time:timeVal,days:[]};
        }
        if(foundTasks[key].days.indexOf(dayNum)===-1){
          foundTasks[key].days.push(dayNum);
        }
        // Keep longest description
        if(descVal.length>foundTasks[key].desc.length){
          foundTasks[key].desc=descVal;
        }
      }
    }
    
    if(hasScheduleSheets){
      var taskList=[];
      for(var k in foundTasks) taskList.push(foundTasks[k]);
      if(!taskList.length){ts("No tasks found in day sheets");return;}
      showImportPreview(taskList,isOb);
      return;
    }
    
    // Fallback: old habit tracker format (column B, rows 11-27 of first sheet)
    var habits=[],ws=wb.Sheets[wb.SheetNames[0]];
    for(var r=10;r<=26;r++){var c=ws[XLSX.utils.encode_cell({r:r,c:1})];if(c&&c.v&&typeof c.v==="string"&&c.v.trim())habits.push(c.v.trim());}
    if(!habits.length){var rng2=XLSX.utils.decode_range(ws["!ref"]||"A1");for(var r=0;r<=rng2.e.r;r++){var c=ws[XLSX.utils.encode_cell({r:r,c:0})];if(c&&c.v&&typeof c.v==="string"&&c.v.trim()&&c.v!=="HABITS")habits.push(c.v.trim());}}
    if(!habits.length){ts("No tasks found");return;}
    showImportMap(habits,isOb);
  }catch(err){ts("Error: "+err.message);}};reader.readAsArrayBuffer(file);
}

  for(var d=1;d<=dim;d++)(function(d){var ds=y+"-"+pad(m+1)+"-"+pad(d),dt=new Date(y,m,d);if(dt>now)return;ld(ds,function(o){var ce=document.getElementById("cd"+d);if(!ce)return;if(ds===td())ce.classList.add("now");var c=cntDone(o,ds);if(c.done>0&&c.done===c.total){ce.classList.add("pf");ce.innerHTML='<span class="cy-mask">'+markHTML(false)+'</span><span class="cy-d">'+d+'</span>';}else if(c.done>0)ce.classList.add("pt");});})(d);

function showDtl(ds,obj){var tasks=getAllTasksForDate(ds),c=cntDone(obj,ds),dl=mk(ds).toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"short"}),pct=c.total?Math.round(c.done/c.total*100):0;

function lRep(y,m){var dim=new Date(y,m+1,0).getDate(),ld2=0,rows=[],tgt=0;for(var d=1;d<=dim;d++){if(mk(y+"-"+pad(m+1)+"-"+pad(d))>new Date())break;tgt++;}

  for(var d=1;d<=tgt;d++)(function(d){var ds=y+"-"+pad(m+1)+"-"+pad(d);ld(ds,function(o){rows[d-1]={ds:ds,obj:o,c:cntDone(o,ds)};ld2++;if(ld2>=tgt)sRS(rows.filter(Boolean));});})(d);}
function sRS(rows){var t2=0,tp=0,ac=0,pf=0;for(var i=0;i<rows.length;i++){t2+=rows[i].c.done;tp+=rows[i].c.total;if(rows[i].c.done>0)ac++;if(rows[i].c.done===rows[i].c.total&&rows[i].c.total>0)pf++;}

function dlX(y,m){

function isHit(ds){return (SUMAP[ds]&&SUMAP[ds].done)||(SUD.freezes&&SUD.freezes.indexOf(ds)!==-1);}
function loadSU(cb){

function computeSU(){
  var s=0,d=new Date();
  if(!isHit(td()))d.setDate(d.getDate()-1);
  for(var i=0;i<400;i++){var ds=fm(d);if(isHit(ds)){s++;d.setDate(d.getDate()-1);}else break;}
  SUSTREAK=s;if(s>(SUD.best||0))SUD.best=s;
  var t=0;for(var k in SUMAP)if(SUMAP[k].done)t++;SUD.total=t;
}

function genCode(){var ch="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",c="";for(var i=0;i<5;i++)c+=ch[Math.floor(Math.random()*ch.length)];return c;}
function saveDuelRef(cb){db.collection("users").doc(U.uid).update({activeDuel:UD.activeDuel||"",duelRole:UD.duelRole||""}).then(function(){if(cb)cb();}).catch(function(){if(cb)cb();});}
function createDuel(tries){
  tries=tries||0;if(tries>4){ts("Couldn't create duel, try again");return;}
  var code=genCode(),ref=db.collection("duels").doc(code);
  ref.get().then(function(d){
    if(d.exists){createDuel(tries+1);return;}// code already taken — pick another
    var doc={code:code,hostUid:U.uid,hostName:UD.name||"Me",hostPhoto:UD.photo||"",hostScore:SUSTREAK,guestUid:"",guestName:"",guestPhoto:"",guestScore:0,createdAt:Date.now()};
    ref.set(doc).then(function(){
      UD.activeDuel=code;UD.duelRole="host";saveDuelRef(function(){ts("Duel created! Share your code");renderPage();});
    }).catch(function(){ts("Couldn't create duel — database access needed");});
  }).catch(function(){ts("Couldn't create duel — database access needed");});
}
function joinDuel(code){
  code=(code||"").trim().toUpperCase();if(!code){ts("Enter a code");return;}
  db.collection("duels").doc(code).get().then(function(d){
    if(!d.exists){ts("Duel not found");return;}
    var data=d.data();
    if(data.hostUid===U.uid){UD.activeDuel=code;UD.duelRole="host";saveDuelRef(renderPage);return;}
    if(data.guestUid&&data.guestUid!==U.uid){ts("Duel is full");return;}
    db.collection("duels").doc(code).update({guestUid:U.uid,guestName:UD.name||"Me",guestPhoto:UD.photo||"",guestScore:SUSTREAK}).then(function(){
      UD.activeDuel=code;UD.duelRole="guest";saveDuelRef(function(){ts("Joined the duel!");renderPage();});
    }).catch(function(){ts("Couldn't join — database access needed");});
  }).catch(function(){ts("Couldn't reach duel — database access needed");});
}
function leaveDuel(){
  var code=UD.activeDuel,role=UD.duelRole;
  if(_duelUnsub){_duelUnsub();_duelUnsub=null;}// stop listening before we mutate the shared doc
  function done(){UD.activeDuel="";UD.duelRole="";saveDuelRef(function(){ts("Left duel");renderPage();});}
  if(code&&role==="host"){
    // Host leaving ends the duel for BOTH players — the guest's live listener sees the doc vanish.
    db.collection("duels").doc(code).delete().then(done).catch(done);
  }else if(code&&role==="guest"){
    // Guest leaving frees the slot so the host immediately sees "Waiting..." again.
    db.collection("duels").doc(code).update({guestUid:"",guestName:"",guestPhoto:"",guestScore:0}).then(done).catch(done);
  }else done();
}
function updateDuelScore(){
  if(!UD.activeDuel)return;
  var f=UD.duelRole==="host"?{hostScore:SUSTREAK}:{guestScore:SUSTREAK};
  db.collection("duels").doc(UD.activeDuel).update(f).catch(function(){});
}
// A shared task is "active" on a date if within its optional start/end window
function taskActive(t,ds){return (!t.start||ds>=t.start)&&(!t.end||ds<=t.end);}
// Shared-task duel: consecutive days a partner ticked ALL tasks that were active that day
function duelStreak(x,role){
  var tasks=x.tasks||[];if(!tasks.length)return 0;
  var done=(x.done&&x.done[role])||{};
  function dayOk(ds){var act=tasks.filter(function(t){return taskActive(t,ds);});if(!act.length)return false;var arr=done[ds]||[];for(var i=0;i<act.length;i++)if(arr.indexOf(act[i].id)===-1)return false;return true;}
  var s=0,d=new Date();
  if(!dayOk(td()))d.setDate(d.getDate()-1);
  for(var i=0;i<400;i++){var ds=fm(d);if(dayOk(ds)){s++;d.setDate(d.getDate()-1);}else break;}
  return s;
}
function duelAddTask(name,end){
  name=(name||"").trim();if(!name){ts("Enter a task");return;}if(!UD.activeDuel)return;
  var task={id:"dt_"+Date.now(),name:name.slice(0,60),by:UD.duelRole,start:td()};
  if(end)task.end=end;
  db.collection("duels").doc(UD.activeDuel).update({tasks:firebase.firestore.FieldValue.arrayUnion(task)}).then(function(){ts("Shared task added");}).catch(function(){ts("Couldn't add — database access needed");});
}
function duelToggleTask(tid,checked){

function duelDeleteTask(tid){

  g.subLog[ds]=arr;

function gC(uid){var ch="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",h=0;for(var i=0;i<uid.length;i++){h=((h<<5)-h)+uid.charCodeAt(i);h|=0;}h=Math.abs(h);var c="1PCT-";for(var i=0;i<6;i++){c+=ch[h%ch.length];h=Math.floor(h/ch.length)+i*7+13;}return c;}

// STREAK
// Streak shown across the app = the Show Up streak (already loaded in one query by loadSU).
// This replaces the old task-completion streak that made up to 120 sequential Firestore reads on load.
function dS(){SK=SUSTREAK;var t=SUSTREAK>0?("&#128293; "+SUSTREAK+" day"+(SUSTREAK>1?"s":"")+" streak"):"Start your streak today";var el=document.getElementById("stk");if(el)el.innerHTML=t;var el2=document.getElementById("stk2");if(el2)el2.innerHTML=t;}

// ===================== AI ASSISTANT =====================
var _aiHist=[];      // conversation history sent to the model (Anthropic message format)
var _aiBusy=false;
var DAY_NAMES={sunday:0,sun:0,monday:1,mon:1,tuesday:2,tue:2,tues:2,wednesday:3,wed:3,thursday:4,thu:4,thurs:4,friday:5,fri:5,saturday:6,sat:6};

// Convert a natural day spec into an array of weekday ints (0=Sun..6=Sat).
function aiParseDays(days,frequency){
  if(frequency){var f=(""+frequency).toLowerCase();
    if(f==="daily"||f==="everyday"||f==="every day")return [0,1,2,3,4,5,6];
    if(f==="weekdays")return [1,2,3,4,5];
    if(f==="weekends"||f==="weekend")return [0,6];}
  var out=[];
  if(Array.isArray(days)){for(var i=0;i<days.length;i++){var k=(""+days[i]).toLowerCase().trim();
    if(k==="daily"||k==="everyday")return [0,1,2,3,4,5,6];
    if(k==="weekdays")return [1,2,3,4,5];
    if(k==="weekends")return [0,6];
    if(DAY_NAMES.hasOwnProperty(k)&&out.indexOf(DAY_NAMES[k])===-1)out.push(DAY_NAMES[k]);}}
  return out.length?out.sort():[0,1,2,3,4,5,6];// default: every day
}
function aiFindTask(name){
  if(!name)return null;var n=(""+name).toLowerCase().trim(),list=(UD.tasks||[]);
  for(var i=0;i<list.length;i++)if((list[i].name||"").toLowerCase()===n)return list[i];
  for(var i=0;i<list.length;i++)if((list[i].name||"").toLowerCase().indexOf(n)!==-1)return list[i];
  return null;
}
function aiDayLabel(arr){if(arr.length===7)return "every day";if(arr.length===5&&arr.indexOf(0)===-1&&arr.indexOf(6)===-1)return "weekdays";if(arr.length===2&&arr.indexOf(0)!==-1&&arr.indexOf(6)!==-1)return "weekends";return arr.map(function(d){return DN[d];}).join(", ");}

// ---- Tool definitions (Anthropic tool-use schema) ----
var AI_TOOLS=[
  {name:"add_task",description:"Create a new recurring daily task/habit on the user's tracker. Ask for the name and schedule if the user hasn't given them.",input_schema:{type:"object",properties:{
    name:{type:"string",description:"Short task name, e.g. 'Morning run'"},
    frequency:{type:"string",enum:["daily","weekdays","weekends"],description:"Use for common schedules. Omit if specific days are given."},
    days:{type:"array",items:{type:"string",enum:["monday","tuesday","wednesday","thursday","friday","saturday","sunday"]},description:"Specific weekdays. Omit if 'frequency' is used."},
    time:{type:"string",description:"Optional time of day as free text, e.g. '7am' or '18:30'."},
    description:{type:"string",description:"Optional short note."}
  },required:["name"]}},
  {name:"complete_task_today",description:"Mark one of the user's existing tasks as done for TODAY.",input_schema:{type:"object",properties:{name:{type:"string",description:"Name (or part of the name) of the task to tick off."}},required:["name"]}},
  {name:"list_tasks",description:"List the user's current active tasks with their schedules.",input_schema:{type:"object",properties:{}}},
  {name:"delete_task",description:"Permanently delete one of the user's tasks by name. Confirm with the user first if unsure.",input_schema:{type:"object",properties:{name:{type:"string"}},required:["name"]}},
  {name:"start_goal",description:"Start a longer challenge/goal (e.g. '30 day no sugar', '75 hard'). Uses a duration in days.",input_schema:{type:"object",properties:{
    name:{type:"string",description:"Goal name."},
    days:{type:"integer",description:"Duration in days (e.g. 30, 75, 100)."},
    description:{type:"string",description:"Optional one-line description."}
  },required:["name","days"]}},
  {name:"mark_show_up",description:"Log that the user 'showed up' today (their daily streak commitment).",input_schema:{type:"object",properties:{}}},
  {name:"get_status",description:"Get the user's current stats: show-up streak, coins, total tasks/goals, and today's tasks with completion state.",input_schema:{type:"object",properties:{}}},
  {name:"navigate",description:"Switch the app to a page so the user can see it.",input_schema:{type:"object",properties:{page:{type:"string",enum:["dashboard","showup","goals","today","calendar","tasks","rewards"]}},required:["page"]}}
];

function aiSystemPrompt(){
  var name=(UD&&UD.name?UD.name.split(" ")[0]:"there");
  var today=new Date();
  return "You are Kairos AI, a warm, concise assistant built into the Kairos habit-tracking app. "+
    "You help "+name+" manage their habits by calling tools — you don't just give advice, you take action. "+
    "Today is "+DNF[today.getDay()]+", "+today.toDateString()+". The user's local date string is "+td()+". "+
    "Guidelines: "+
    "1) When the user asks to add/complete/delete a task, start a goal, mark a show-up, or check status, call the matching tool. "+
    "2) If a required detail is missing (e.g. a task name or which days), ask ONE short clarifying question instead of guessing. "+
    "3) After a tool succeeds, confirm what you did in one friendly sentence. Keep replies short (1-3 sentences), no markdown headers. "+
    "4) 'Every day' = daily; 'weekdays' = Mon-Fri; 'weekends' = Sat+Sun. "+
    "5) You can only act on this user's own data. Be encouraging about their streak.";
}

// ---- Execute a tool call locally against the user's data ----
function aiRunTool(name,input,done){
  input=input||{};
  try{
    if(name==="add_task"){
      var tn=(input.name||"").trim();if(!tn){done({error:"No task name given."});return;}
      var arr=aiParseDays(input.days,input.frequency);
      var task={id:"t_"+Date.now(),name:tn,desc:(input.description||"").trim(),time:(input.time||"").trim(),days:arr,numId:"",numLabel:"",startDate:td()};
      UD.tasks=UD.tasks||[];UD.tasks.push(task);
      saveUD(function(){if(currentPage==="tasks"||currentPage==="today"){LD="";renderPage();}
        done({ok:true,added:tn,schedule:aiDayLabel(arr),time:task.time||"none"});});
      aiAct("Added task: "+tn+" ("+aiDayLabel(arr)+")");return;
    }
    if(name==="complete_task_today"){
      var t=aiFindTask(input.name);if(!t){done({error:"No task found matching '"+(input.name||"")+"'."});return;}
      ld(td(),function(o){o=o||{};o[t.id]=true;sv(td(),o,function(){
        if(currentPage==="today"&&fm(CD)===td()){PD=o;LD="";renderPage();}
        done({ok:true,completed:t.name});});});
      aiAct("Marked done today: "+t.name);return;
    }
    if(name==="list_tasks"){
      var list=(UD.tasks||[]).filter(function(t){return !t.archived;}).map(function(t){return {name:t.name,schedule:aiDayLabel(t.days||[]),time:t.time||""};});
      done({tasks:list,count:list.length});return;
    }
    if(name==="delete_task"){
      var td2=aiFindTask(input.name);if(!td2){done({error:"No task found matching '"+(input.name||"")+"'."});return;}
      UD.tasks=(UD.tasks||[]).filter(function(x){return x.id!==td2.id;});
      saveUD(function(){if(currentPage==="tasks"||currentPage==="today"){LD="";renderPage();}done({ok:true,deleted:td2.name});});
      aiAct("Deleted task: "+td2.name);return;
    }
    if(name==="start_goal"){
      var gn=(input.name||"").trim();if(!gn){done({error:"No goal name given."});return;}
      var d=parseInt(input.days)||30;if(d<1)d=30;
      var st=td(),goal={id:"g_"+Date.now(),presetId:"",icon:"&#127919;",name:gn,desc:(input.description||"").trim(),dur:d+" days",days:d,baseDays:d,rounds:1,subs:[],rule:"all",start:st,target:addDaysStr(st,d),log:[],createdAt:Date.now()};
      UD.goals=UD.goals||[];UD.goals.push(goal);
      saveGoals(function(){if(currentPage==="goals")renderPage();done({ok:true,goal:gn,days:d,ends:goal.target});});
      aiAct("Started goal: "+gn+" ("+d+" days)");return;
    }
    if(name==="mark_show_up"){
      if(SUMAP[td()]&&SUMAP[td()].done){done({ok:true,already:true,streak:SUSTREAK});return;}
      doShowUp("Logged via AI assistant","",false);
      aiAct("Logged today's show-up");
      setTimeout(function(){done({ok:true,streak:SUSTREAK,coins:SUD.coins});},350);return;
    }
    if(name==="get_status"){
      var tasksToday=getTasksForDate(td());
      ld(td(),function(o){o=o||{};
        var todays=tasksToday.map(function(t){return {name:t.name,done:!!o[t.id]};});
        done({showUpStreak:SUSTREAK,coins:SUD.coins||0,bestStreak:SUD.best||0,
          activeTasks:(UD.tasks||[]).filter(function(t){return !t.archived;}).length,
          activeGoals:(UD.goals||[]).length,showedUpToday:!!(SUMAP[td()]&&SUMAP[td()].done),
          todaysTasks:todays});});
      return;
    }
    if(name==="navigate"){
      var pg=input.page;var ok=["dashboard","showup","goals","today","calendar","tasks","rewards"];
      if(ok.indexOf(pg)===-1){done({error:"Unknown page."});return;}
      currentPage=pg;if(pg==="today")CD=new Date();renderPage();
      aiAct("Opened "+pg);done({ok:true,page:pg});return;
    }
    done({error:"Unknown tool: "+name});
  }catch(e){done({error:"Failed: "+((e&&e.message)||e)});}
}

// ---- Chat UI ----
function openAI(){
  var old=document.getElementById("aiPanel");if(old){old.remove();return;}
  var p=document.createElement("div");p.className="ai-panel";p.id="aiPanel";
  p.innerHTML='<div class="ai-head"><div class="ai-orb">&#10022;</div><div><div class="ai-ttl">Kairos AI</div><div class="ai-sub">Your habit co-pilot</div></div><button class="ai-x" id="aiX">&#10005;</button></div>'+
    '<div class="ai-body" id="aiBody"></div>'+
    '<div class="ai-foot"><div class="ai-chips" id="aiChips"></div><div class="ai-inrow"><textarea id="aiIn" rows="1" placeholder="Ask me to add a task, start a goal..."></textarea><button class="ai-send" id="aiSend">&#10148;</button></div></div>';
  document.body.appendChild(p);
  document.getElementById("aiX").onclick=function(){p.remove();};
  var body=document.getElementById("aiBody");
  if(!AI_PROXY_URL){
    body.innerHTML='<div class="ai-setup">&#10022; The AI assistant isn\'t connected yet.<br><br>Deploy the free Cloudflare Worker and paste its URL into <code>AI_PROXY_URL</code> in <code>index.html</code>.<br><br>See <code>DEPLOY-worker.md</code> for the 15-minute guide.</div>';
    document.getElementById("aiSend").disabled=true;document.getElementById("aiIn").disabled=true;
    document.getElementById("aiChips").style.display="none";return;
  }
  // Greeting (not part of model history)
  if(!_aiHist.length){aiBubble("a","Hey "+((UD.name||"there").split(" ")[0])+"! &#10022; I can add tasks, start goals, tick things off, or log your show-up. Just tell me what you need.");}
  else{ // re-render prior conversation
    for(var i=0;i<_aiHist.length;i++){var m=_aiHist[i];if(typeof m.content==="string")aiBubble(m.role==="user"?"u":"a",es(m.content));
      else if(Array.isArray(m.content)){for(var j=0;j<m.content.length;j++){var c=m.content[j];if(c.type==="text"&&m.role!=="user")aiBubble("a",es(c.text));}}}
  }
  var chips=["Add a task","I showed up today","What's my status?","Start a 30 day goal"];

  var inp=document.getElementById("aiIn");
  inp.addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,90)+"px";});
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();aiSubmit();}});
  document.getElementById("aiSend").onclick=aiSubmit;
  setTimeout(function(){inp.focus();},100);
}
function aiScroll(){var b=document.getElementById("aiBody");if(b)b.scrollTop=b.scrollHeight;}
function aiBubble(kind,html){var b=document.getElementById("aiBody");if(!b)return null;var d=document.createElement("div");d.className="ai-msg "+kind;d.innerHTML=html;b.appendChild(d);aiScroll();return d;}
function aiAct(txt){aiBubble("act","&#9889; "+es(txt));}
function aiTyping(on){var b=document.getElementById("aiBody");if(!b)return;var ex=document.getElementById("aiTyping");if(on){if(ex)return;var d=document.createElement("div");d.className="ai-typing";d.id="aiTyping";d.innerHTML="<span></span><span></span><span></span>";b.appendChild(d);aiScroll();}else if(ex)ex.remove();}

function aiSubmit(){
  if(_aiBusy)return;var inp=document.getElementById("aiIn");if(!inp)return;
  var txt=(inp.value||"").trim();if(!txt)return;
  inp.value="";inp.style.height="auto";
  aiBubble("u",es(txt));
  _aiHist.push({role:"user",content:txt});
  aiLoop();
}

// Agentic loop: call the proxy, run any tools, feed results back, repeat.
function aiLoop(){
  _aiBusy=true;var sendBtn=document.getElementById("aiSend");if(sendBtn)sendBtn.disabled=true;
  aiTyping(true);
  fetch(AI_PROXY_URL,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({system:aiSystemPrompt(),messages:_aiHist,tools:AI_TOOLS,max_tokens:1024})})
  .then(function(r){return r.json().then(function(j){return {status:r.status,j:j};});})
  .then(function(res){
    aiTyping(false);
    if(res.status!==200||res.j.error){
      var em=res.j&&res.j.error?(res.j.error.message||res.j.error):("HTTP "+res.status);
      aiBubble("a","&#9888;&#65039; "+es(""+em));aiDone();return;
    }
    var msg=res.j;// a Messages API response
    var blocks=Array.isArray(msg.content)?msg.content:[];
    // Show any text the model produced this turn
    for(var i=0;i<blocks.length;i++){if(blocks[i].type==="text"&&blocks[i].text.trim())aiBubble("a",es(blocks[i].text));}
    // Record the assistant turn verbatim (needed for tool_result correlation)
    _aiHist.push({role:"assistant",content:blocks});
    if(msg.stop_reason==="tool_use"){
      var calls=blocks.filter(function(b){return b.type==="tool_use";});
      var results=[],pending=calls.length;
      if(!pending){aiDone();return;}
      calls.forEach(function(call){
        aiRunTool(call.name,call.input,function(out){
          results.push({type:"tool_result",tool_use_id:call.id,content:JSON.stringify(out)});
          if(--pending===0){
            _aiHist.push({role:"user",content:results});
            aiLoop();// continue so the model can react to results
          }
        });
      });
    }else{aiDone();}
  })
  .catch(function(e){aiTyping(false);aiBubble("a","&#9888;&#65039; Couldn't reach the AI. "+es((e&&e.message)||""));aiDone();});
}
function aiDone(){_aiBusy=false;var b=document.getElementById("aiSend");if(b)b.disabled=false;var i=document.getElementById("aiIn");if(i)i.focus();}
