<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#A90E02">
<title>1% Daily · Show Up</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#FFFBEB;--bg2:#FFFDF4;--card:#FFFFFF;--card2:#FFF8DC;
  --text:#171208;--text2:#5E5228;--text3:#9A8748;--text4:#CBB877;
  --accent:#A90E02;--accent2:#D12A16;--accent-bg:#FCE4DE;--accent-dark:#7C0A01;
  --ink:#141210;--lemon:#FFFBD4;
  --warm:#C48A16;--warm-bg:#FFF3CE;--warm2:#E0A62A;
  --danger:#D6483B;--danger-bg:#FCEAE7;
  --border:#F0E4B4;--border2:#E3D390;
  --shadow:0 1px 3px rgba(90,45,0,.08),0 1px 2px rgba(90,45,0,.05);
  --shadow2:0 6px 18px rgba(140,10,0,.12),0 2px 6px rgba(90,45,0,.06);
  --radius:12px;--radius2:16px;
  --serif:'Anton',Impact,'Arial Narrow Bold',sans-serif;
  --display:'Anton',Impact,'Arial Narrow Bold',sans-serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px;-webkit-font-smoothing:antialiased}
#root{max-width:480px;margin:0 auto;padding:0 16px}

/* Desktop layout */
@media(min-width:768px){
  body{padding-bottom:0}
  #root{max-width:100%;padding:0}
  .app-shell{display:flex;min-height:100vh}
  .sidebar{width:240px;background:var(--card);border-right:1px solid var(--border);padding:20px 0;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:40}
  .sidebar .sb-logo{padding:16px 24px 20px;display:flex;align-items:center;gap:10px}
  .sidebar .sb-logo-icon{font-size:24px}
  .sidebar .sb-logo-text{font-family:var(--serif);font-size:20px;color:var(--text)}
  .sidebar .sb-user{padding:12px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);margin-bottom:12px;padding-bottom:16px}
  .sidebar .sb-user img{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);object-fit:cover}
  .sidebar .sb-user-info{flex:1}
  .sidebar .sb-user-name{font-size:13px;font-weight:600;color:var(--text)}
  .sidebar .sb-user-streak{font-size:11px;color:var(--warm);font-weight:600}
  .sidebar nav{flex:1;padding:0 12px}
  .sidebar nav a{display:flex;align-items:center;gap:12px;padding:11px 16px;text-decoration:none;color:var(--text2);font-size:13px;font-weight:600;border-radius:10px;margin-bottom:2px;transition:all .15s}
  .sidebar nav a:hover{background:var(--card2);color:var(--text)}
  .sidebar nav a.on{background:var(--accent-bg);color:var(--accent-dark)}
  .sidebar nav a .s-ico{font-size:18px;width:24px;text-align:center}
  .sidebar .sb-footer{padding:12px 24px;border-top:1px solid var(--border);margin-top:auto}
  .sidebar .sb-footer button{background:none;border:none;color:var(--text3);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);padding:6px 0}
  .sidebar .sb-footer button:hover{color:var(--text)}
  .main-area{margin-left:240px;flex:1;padding:24px 32px;max-width:960px}
  .main-area .hdr{display:none}
  .bnav{display:none!important}
  .login{max-width:480px;margin:0 auto}
  .onboard{max-width:540px;margin:0 auto}

  /* Dashboard 2-column */
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .dash-grid .dash-left,.dash-grid .dash-right{min-width:0}

  /* Wider cards on desktop */
  .card{padding:24px}

  /* Modal centered on desktop */
  .modal-overlay{align-items:center}
  .modal{border-radius:var(--radius2);max-width:520px}

  /* Page title for desktop */
  .page-title{font-family:var(--serif);font-size:26px;color:var(--text);margin-bottom:20px;font-weight:400;display:block}
}
@media(max-width:767px){
  .sidebar{display:none!important}
  .main-area{margin-left:0!important;padding:0 16px!important}
  .page-title{display:none}
  .dash-grid{display:block}
}

/* Cards */
.card{background:var(--card);border-radius:var(--radius2);padding:20px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-t{font-family:var(--sans);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;font-weight:700}
.card-warm{background:var(--warm-bg);border-color:#EDD8C4}
.card-accent{background:var(--accent-bg);border-color:#D1DBC6}

/* Buttons */
.btn{border:none;border-radius:10px;padding:12px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark)}
.btn-warm{background:var(--warm);color:#fff}
.btn-warm:hover{background:#B3845C}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:var(--card2);color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--border)}
.btn-full{width:100%;justify-content:center}
.btn-sm{padding:8px 14px;font-size:11px;border-radius:8px}

/* Inputs */
input,select,textarea{width:100%;font-size:14px;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;background:var(--card2);color:var(--text);font-family:var(--sans);transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;background:var(--card)}
textarea{resize:vertical;min-height:50px}
input::placeholder,textarea::placeholder{color:var(--text4)}
label{font-size:11px;color:var(--text3);font-weight:600;display:block;margin-bottom:4px;margin-top:14px;text-transform:uppercase;letter-spacing:.5px}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 24px;border-radius:var(--radius);font-size:13px;font-weight:600;z-index:1000;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.empty{color:var(--text4);font-size:13px;text-align:center;padding:24px}

/* Login */
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:30px;text-align:center}
.login-logo{font-size:42px;margin-bottom:4px}
.login h1{font-family:var(--serif);font-size:32px;color:var(--text);font-weight:400}
.login p{font-size:14px;color:var(--text3);margin:8px 0 36px;line-height:1.6}
.g-btn{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 28px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);color:var(--text);font-family:var(--sans);transition:all .15s}
.g-btn:hover{box-shadow:var(--shadow2);border-color:var(--border2)}
.g-btn img{width:20px;height:20px}
.feat{font-size:13px;color:var(--text3);padding:7px 0;text-align:left;display:flex;align-items:center;gap:8px}
.feat-icon{font-size:16px}

/* Onboarding */
.onboard{padding:20px 0;min-height:100vh}
.ob-title{font-family:var(--serif);font-size:26px;color:var(--text);margin-bottom:4px;font-weight:400}
.ob-sub{font-size:13px;color:var(--text3);margin-bottom:20px;line-height:1.5}
.ob-step{font-size:10px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}

/* Header */
.hdr{background:var(--card);border-radius:var(--radius2);padding:18px 20px;margin-top:12px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border);display:flex;align-items:center;gap:14px}
.av{width:42px;height:42px;border-radius:50%;border:2px solid var(--border);object-fit:cover}
.hdr .info{flex:1}
.hdr .lbl{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);font-weight:600}
.hdr .nm{font-family:var(--serif);font-size:20px;color:var(--text);margin-top:2px;font-weight:400}
.hdr .stk{font-size:12px;color:var(--warm);margin-top:3px;font-weight:600}
.so{background:var(--card2);border:1px solid var(--border);color:var(--text3);border-radius:8px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--sans)}
.so:hover{background:var(--border)}

/* Bottom Nav */
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:50;padding:4px 0 env(safe-area-inset-bottom,6px)}
.bnav a{flex:1;text-align:center;padding:6px 0;text-decoration:none;color:var(--text4);font-size:9px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .15s;font-family:var(--sans)}
.bnav a .ico{font-size:20px}
.bnav a.on{color:var(--accent)}

/* Day Navigator */
.dn{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.dn button{background:none;border:none;color:var(--accent);font-size:22px;cursor:pointer;padding:4px 12px;font-weight:600}
.dn button:hover{color:var(--accent-dark)}
.dn-label{font-family:var(--serif);font-size:16px;color:var(--text)}
.dn-sub{font-size:11px;color:var(--text3);margin-top:1px}

/* Tasks */
.rw{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);-webkit-tap-highlight-color:transparent}
.rw:last-child{border-bottom:none}
.ck{width:22px;height:22px;border:2px solid var(--border2);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin-top:2px;transition:all .15s;cursor:pointer}
.ck.on{background:var(--accent);border-color:var(--accent)}
.tn{font-size:14px;font-weight:600;color:var(--text)}
.td2{font-size:11px;color:var(--text3);margin-top:3px;line-height:1.4}
.rw.done .tn{opacity:.4;text-decoration:line-through}
.rw.done .td2{opacity:.25}
.freq-tag{font-size:9px;color:var(--accent);background:var(--accent-bg);padding:2px 7px;border-radius:5px;font-weight:700;margin-left:6px}
.nb{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;background:var(--card2);border-radius:8px;border:1px solid var(--border)}
.nb span{font-size:11px;color:var(--text3);flex:1}
.nb input{width:54px;background:var(--card);border:1.5px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;padding:5px 8px;text-align:center}

/* Submit */
.sub-wrap{position:sticky;bottom:72px;z-index:10}
@media(min-width:768px){.sub-wrap{bottom:20px}}
.sub-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:16px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(169,14,2,.3);font-family:var(--sans);transition:all .15s}
.sub-btn:active{transform:scale(.97)}
.sub-btn.saved{background:var(--warm)}
.sub-btn:disabled{opacity:.5}

/* Day pills */
.day-pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.day-pill{padding:7px 11px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);color:var(--text3);background:var(--card2);user-select:none;transition:all .15s;font-family:var(--sans)}
.day-pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.day-pill:hover{border-color:var(--accent)}

/* Task management */
.task-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card2);border-radius:var(--radius);margin-bottom:8px;border:1px solid var(--border);transition:all .15s}
.task-item:hover{box-shadow:var(--shadow)}
.task-item .t-info{flex:1}
.task-item .t-name{font-size:14px;font-weight:600;color:var(--text)}
.task-item .t-meta{font-size:11px;color:var(--text3);margin-top:3px}
.task-item .t-days{font-size:10px;color:var(--accent);margin-top:2px;font-weight:600}
.task-item.archived{opacity:.45}
.task-actions{display:flex;gap:4px}
.task-actions button{background:none;border:1px solid transparent;font-size:15px;cursor:pointer;padding:6px;border-radius:8px;transition:all .15s}
.task-actions button:hover{background:var(--border);border-color:var(--border2)}

/* Calendar */
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cg .ch{font-size:10px;color:var(--text3);text-align:center;padding:4px;font-weight:600}
.cy{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;cursor:pointer;background:var(--card2);color:var(--text4);transition:all .15s}
.cy:hover{background:var(--border)}
.cy.pf{background:var(--accent);color:#fff}
.cy.pt{background:var(--accent-bg);color:var(--accent-dark)}
.cy.now{outline:2px solid var(--warm);outline-offset:-1px}
.mn{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mn span{font-family:var(--serif);font-size:16px}
.mn button{background:none;border:none;color:var(--accent);font-size:18px;cursor:pointer;padding:4px 10px;font-weight:600}

/* Dashboard week grid */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week-day{background:var(--card2);border-radius:10px;padding:10px 4px;text-align:center;border:1px solid var(--border);transition:all .15s;cursor:pointer}
.week-day:hover{box-shadow:var(--shadow);border-color:var(--border2)}
.week-day.today{border-color:var(--accent);border-width:2px;background:var(--accent-bg)}
.week-day .wd-name{font-size:10px;font-weight:700;color:var(--text3)}
.week-day .wd-date{font-size:13px;font-weight:600;margin-top:2px;color:var(--text)}
.week-day .wd-count{font-size:9px;color:var(--accent);margin-top:4px;font-weight:700}

/* Stats */
.sb{background:var(--card2);border-radius:10px;padding:16px;text-align:center;border:1px solid var(--border)}
.sb .big{font-family:var(--serif);font-size:28px;font-weight:400}
.sb .sm{font-size:10px;color:var(--text3);margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}

/* Rewards */
.rew-banner{background:linear-gradient(135deg,#D12A16,#A90E02);border-radius:var(--radius2);padding:24px;margin-bottom:14px;text-align:center;color:#fff;box-shadow:0 4px 16px rgba(169,14,2,.25)}
.rew-code{background:rgba(255,255,255,.9);border-radius:10px;padding:12px;margin-top:12px;font-size:20px;font-weight:800;color:var(--text);letter-spacing:3px;font-family:monospace}
.pbar{background:var(--border);border-radius:10px;height:10px;margin-top:16px;overflow:hidden}
.pfill{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;border-radius:10px}
.ms{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.ms:last-child{border-bottom:none}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{font-size:10px;background:var(--card2);border-radius:var(--radius);padding:6px 12px;color:var(--text3);font-weight:600;border:1px solid var(--border)}
.badge.earned{background:var(--accent-bg);color:var(--accent-dark);border-color:#D1DBC6}
.badge.gold{background:linear-gradient(135deg,#D4A574,#C4956A);color:#fff;border-color:transparent}

/* Import */
.import-zone{border:2px dashed var(--border2);border-radius:var(--radius2);padding:32px;text-align:center;cursor:pointer;transition:all .2s;background:var(--card2)}
.import-zone:hover{border-color:var(--accent);background:var(--accent-bg)}
.import-zone.dragover{border-color:var(--accent);background:var(--accent-bg)}
.import-row{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card2);border-radius:10px;margin-bottom:8px;border:1px solid var(--border)}
.import-row .ir-name{flex:1;font-size:13px;font-weight:600}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(44,36,22,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:24px}
.modal-title{font-family:var(--serif);font-size:20px;font-weight:400;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text3);padding:4px}
.modal-close:hover{color:var(--text)}

/* Locked */
.locked-msg{background:var(--warm-bg);color:var(--warm);font-size:12px;padding:12px 16px;border-radius:10px;text-align:center;margin-bottom:14px;font-weight:600;border:1px solid #EDD8C4}

/* Quote */
.quote{text-align:center;font-family:var(--serif);font-size:14px;color:var(--text3);font-style:italic;margin:20px 0 24px;line-height:1.6}

/* Next week rows */
.nw-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;align-items:center}
.nw-row:last-child{border-bottom:none}
.nw-day{min-width:50px;font-weight:700;color:var(--accent);font-size:11px}
.nw-tasks{flex:1;color:var(--text2);line-height:1.4}
.nw-count{font-weight:700;color:var(--text);font-size:13px;background:var(--card2);padding:2px 8px;border-radius:6px}

/* Poster-style headings */
.login h1,.hdr .nm,.dn-label,.mn span,.page-title,.ob-title,.modal-title,.sb-logo-text{letter-spacing:.5px}
.sb .big{letter-spacing:.5px}

/* ===== SHOW UP ===== */
.su-hero{background:var(--accent);color:var(--lemon);border-radius:var(--radius2);padding:26px 22px 24px;text-align:center;box-shadow:var(--shadow2);position:relative;overflow:hidden;margin-bottom:14px}
.su-hero:before{content:"";position:absolute;top:-40px;right:-40px;width:150px;height:150px;background:rgba(255,251,212,.08);border-radius:50%}
.su-hero .su-kicker{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;font-weight:800;opacity:.9;position:relative}
.su-hero h2{font-family:var(--display);font-size:46px;line-height:.92;letter-spacing:1.5px;margin:6px 0 4px;text-transform:uppercase;position:relative}
.su-hero .su-date{font-size:12px;opacity:.9;font-weight:600;position:relative}
.su-flame{font-size:44px;margin:10px 0 2px;position:relative}
.su-streaknum{font-family:var(--display);font-size:40px;line-height:1;letter-spacing:1px;position:relative}
.su-btn{margin-top:18px;background:var(--ink);color:#fff;border:none;border-radius:14px;padding:18px 24px;font-family:var(--display);font-size:24px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;width:100%;box-shadow:0 6px 0 rgba(0,0,0,.4);transition:transform .1s,box-shadow .1s;position:relative}
.su-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.su-btn.done{background:rgba(255,251,212,.18);color:var(--lemon);cursor:default;box-shadow:none;font-size:18px}
.su-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.su-stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 4px;text-align:center;box-shadow:var(--shadow)}
.su-stat .n{font-family:var(--display);font-size:24px;color:var(--accent);line-height:1;letter-spacing:.5px}
.su-stat .n.gold{color:var(--warm)}
.su-stat .l{font-size:8.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-weight:700;margin-top:5px}
.chain{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;padding-bottom:14px}
.chain .lk{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--card2);border:1.5px solid var(--border);position:relative;cursor:pointer;transition:all .15s}
.chain .lk.hit{background:var(--accent);border-color:var(--accent);color:#fff}
.chain .lk.frozen{background:var(--warm-bg);border-color:var(--warm2)}
.chain .lk.today{outline:2.5px solid var(--ink);outline-offset:2px}

function getTasksForDate(ds){
  if(!UD||!UD.tasks)return[];var dt=mk(ds),dow=dt.getDay(),r=[];
  for(var i=0;i<UD.tasks.length;i++){var t=UD.tasks[i];if(t.archived)continue;
    if(t.days&&t.days.length>0){if(t.days.indexOf(dow)!==-1)r.push(t);continue;}
    if(t.freq==="daily"){r.push(t);continue;}
    if(t.freq==="weekly"&&dow===1){r.push(t);continue;}
    if(t.freq==="monthly"&&dt.getDate()===1){r.push(t);continue;}
    if(t.freq==="custom"&&t.startDate&&t.customDays){var s=mk(t.startDate),df=Math.round((dt-s)/864e5);if(df>=0&&df%t.customDays===0)r.push(t);}
  }return r;
}
function getAllTasksForDate(ds){
  if(!UD)return[];var dt=mk(ds),dow=dt.getDay(),all=(UD.tasks||[]).concat(UD.archivedTasks||[]),r=[];
  for(var i=0;i<all.length;i++){var t=all[i];
    if(t.days&&t.days.length>0){if(t.days.indexOf(dow)!==-1)r.push(t);continue;}

}

// IMPORT
function handleImport(file,isOb){
  var reader=new FileReader();reader.onload=function(e){try{
    var d=new Uint8Array(e.target.result),wb=XLSX.read(d,{type:"array"});
    // Strategy: detect schedule format (sheets named Mon/Tue/etc with TIME,TASK,DESCRIPTION columns)
    var daySheetMap={Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6,Sun:0,Monday:1,Tuesday:2,Wednesday:3,Thursday:4,Friday:5,Saturday:6,Sunday:0};
    var foundTasks={};// key=taskName, value={name,desc,time,days:[]}
    var hasScheduleSheets=false;
    
    for(var si=0;si<wb.SheetNames.length;si++){
      var sn=wb.SheetNames[si];
      var dayNum=daySheetMap[sn];
      if(dayNum===undefined) continue;
      hasScheduleSheets=true;
      var ws=wb.Sheets[sn];
      if(!ws["!ref"]) continue;
      var rng=XLSX.utils.decode_range(ws["!ref"]);
      
      // Find header row (look for TIME or TASK in first 10 rows)
      var hdrRow=-1,colTime=-1,colTask=-1,colDesc=-1,colCat=-1;
      for(var r=0;r<=Math.min(rng.e.r,10);r++){
        for(var c=0;c<=rng.e.c;c++){
          var cell=ws[XLSX.utils.encode_cell({r:r,c:c})];
          if(!cell||!cell.v) continue;
          var v=String(cell.v).trim().toUpperCase();
          if(v==="TIME"){hdrRow=r;colTime=c;}
          if(v==="TASK"){hdrRow=r;colTask=c;}
          if(v==="DESCRIPTION"||v==="DETAILS"){colDesc=c;}
          if(v==="CATEGORY"){colCat=c;}
        }
        if(hdrRow>=0) break;
      }
      if(colTask===-1) colTask=1;// fallback column B
      if(colTime===-1) colTime=0;// fallback column A
      if(colDesc===-1) colDesc=2;// fallback column C
      
      // Read tasks from rows after header
      var startRow=(hdrRow>=0)?hdrRow+1:4;
      for(var r=startRow;r<=rng.e.r;r++){
        var taskCell=ws[XLSX.utils.encode_cell({r:r,c:colTask})];
        if(!taskCell||!taskCell.v) continue;
        var taskName=String(taskCell.v).trim();
        if(!taskName) continue;
        // Skip section headers (FIXED MORNING BLOCK, EVENING BLOCK, etc)
        var upper=taskName.toUpperCase();
        if(upper.indexOf("FIXED")===0||upper.indexOf("EVENING")===0||upper.indexOf("MORNING")===0) continue;
        // Skip non-task rows (merged cells with section titles)
        if(taskName.length>80) continue;
        
        var timeCell=ws[XLSX.utils.encode_cell({r:r,c:colTime})];
        var descCell=ws[XLSX.utils.encode_cell({r:r,c:colDesc})];
        var timeVal=timeCell&&timeCell.v?String(timeCell.v).trim():"";
        var descVal=descCell&&descCell.v?String(descCell.v).trim():"";
        
        // Deduplicate: same task name across days gets merged
        var key=taskName.replace(/\s+/g," ");
        if(!foundTasks[key]){
          foundTasks[key]={name:taskName,desc:descVal,time:timeVal,days:[]};
        }
        if(foundTasks[key].days.indexOf(dayNum)===-1){
          foundTasks[key].days.push(dayNum);
        }
        // Keep longest description
        if(descVal.length>foundTasks[key].desc.length){
          foundTasks[key].desc=descVal;
        }
      }
    }
    
    if(hasScheduleSheets){
      var taskList=[];
      for(var k in foundTasks) taskList.push(foundTasks[k]);
      if(!taskList.length){ts("No tasks found in day sheets");return;}
      showImportPreview(taskList,isOb);
      return;
    }
    
    // Fallback: old habit tracker format (column B, rows 11-27 of first sheet)
    var habits=[],ws=wb.Sheets[wb.SheetNames[0]];
    for(var r=10;r<=26;r++){var c=ws[XLSX.utils.encode_cell({r:r,c:1})];if(c&&c.v&&typeof c.v==="string"&&c.v.trim())habits.push(c.v.trim());}
    if(!habits.length){var rng2=XLSX.utils.decode_range(ws["!ref"]||"A1");for(var r=0;r<=rng2.e.r;r++){var c=ws[XLSX.utils.encode_cell({r:r,c:0})];if(c&&c.v&&typeof c.v==="string"&&c.v.trim()&&c.v!=="HABITS")habits.push(c.v.trim());}}
    if(!habits.length){ts("No tasks found");return;}
    showImportMap(habits,isOb);
  }catch(err){ts("Error: "+err.message);}};reader.readAsArrayBuffer(file);
}

function isHit(ds){return (SUMAP[ds]&&SUMAP[ds].done)||(SUD.freezes&&SUD.freezes.indexOf(ds)!==-1);}
function loadSU(cb){
  if(!U){if(cb)cb();return;}
  db.collection("users").doc(U.uid).collection("showups").get().then(function(qs){
    SUMAP={};qs.forEach(function(d){SUMAP[d.id]=d.data();});computeSU();if(cb)cb();
  }).catch(function(){computeSU();if(cb)cb();});
}
function computeSU(){
  var s=0,d=new Date();
  if(!isHit(td()))d.setDate(d.getDate()-1);
  for(var i=0;i<400;i++){var ds=fm(d);if(isHit(ds)){s++;d.setDate(d.getDate()-1);}else break;}
  SUSTREAK=s;if(s>(SUD.best||0))SUD.best=s;
  var t=0;for(var k in SUMAP)if(SUMAP[k].done)t++;SUD.total=t;
}
function saveSUmeta(cb){
  if(!U){if(cb)cb();return;}
  db.collection("users").doc(U.uid).update({showupCoins:SUD.coins,showupBest:SUD.best,showupFreezes:SUD.freezes||[]}).then(function(){if(cb)cb();}).catch(function(){if(cb)cb();});
}
function doShowUp(note,thumb,verified){
  var ds=td();
  if(SUMAP[ds]&&SUMAP[ds].done){ts("Already showed up today");return;}
  var rec={done:true,ts:Date.now(),note:note||"",verified:!!verified};
  if(thumb)rec.thumb=thumb;
  db.collection("users").doc(U.uid).collection("showups").doc(ds).set(rec).then(function(){
    SUMAP[ds]=rec;SUD.coins=(SUD.coins||0)+5;computeSU();
    saveSUmeta(function(){updateDuelScore();ts("&#128293; You showed up! +5 coins");renderPage();});
  }).catch(function(e){ts("Error: "+e.message);});
}
function freezeDay(ds){
  if((SUD.coins||0)<10){ts("Need 10 coins to repair");return;}
  SUD.freezes=SUD.freezes||[];if(SUD.freezes.indexOf(ds)===-1)SUD.freezes.push(ds);

}

  else{h+='<div class="card" style="text-align:center;padding:28px"><div style="font-size:40px">&#128293;</div><div style="font-family:var(--serif);font-size:22px;margin-top:8px">'+s+' / 21 Days</div><div style="font-size:12px;color:var(--text3);margin-top:6px">Complete 21-day streak for your reward</div><div class="pbar"><div class="pfill" style="width:'+Math.round(s/21*100)+'%"></div></div><div style="font-size:11px;color:var(--text3);margin-top:6px">'+Math.round(s/21*100)+'%</div></div>';}
  h+='<div class="card"><div class="card-t">Milestones</div>';
  for(var i=0;i<MILES.length;i++){var m=MILES[i],e=s>=m.d;h+='<div class="ms"><div style="font-size:24px;width:36px;text-align:center">'+m.i+'</div><div style="flex:1"><div style="font-size:13px;font-weight:600">'+m.n+'</div><div style="font-size:11px;color:var(--text3)">'+m.d+'-day streak</div></div><div style="font-size:11px;font-weight:700;color:'+(e?"var(--accent)":"var(--text4)")+'">'+(e?"&#10003; Earned":m.d+" days")+'</div></div>';}
  h+='</div>';
  h+='<div class="card"><div class="card-t">Badges</div><div class="badge-row">';
  for(var i=0;i<MILES.length;i++){var m=MILES[i],e=s>=m.d;h+='<span class="badge'+(e?(m.d>=21?" gold":" earned"):"")+'">'+(e?m.i+" "+m.n:"&#128274; "+m.d+"d")+'</span>';}
  h+='</div></div>';
  h+='<div class="card"><div class="card-t">Feedback</div><textarea id="ft" placeholder="Share feedback or ideas..." rows="2"></textarea><button class="btn btn-primary btn-sm btn-full" id="fb" style="margin-top:8px">Send Feedback</button></div>';
  el.innerHTML=h;
  if(s>=21){document.getElementById("cpb").onclick=function(){var c=document.getElementById("cc").textContent;if(navigator.clipboard)navigator.clipboard.writeText(c);ts("Copied!");};}
  var fb=document.getElementById("fb"),ft=document.getElementById("ft");if(fb)fb.onclick=function(){var m=ft.value.trim();if(!m){ts("Write something");return;}fb.disabled=true;fb.textContent="Sending...";db.collection("feedback").add({uid:U.uid,name:UD.name,email:UD.email,msg:m,ts:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){ft.value="";fb.disabled=false;fb.textContent="Send Feedback";ts("Thanks!");}).catch(function(){fb.disabled=false;fb.textContent="Send Feedback";});};
}
function gC(uid){var ch="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",h=0;for(var i=0;i<uid.length;i++){h=((h<<5)-h)+uid.charCodeAt(i);h|=0;}h=Math.abs(h);var c="1PCT-";for(var i=0;i<6;i++){c+=ch[h%ch.length];h=Math.floor(h/ch.length)+i*7+13;}return c;}

// STREAK
function cS(){var s=0,d=new Date(),c2=0;function go(){if(c2>=120){SK=s;dS();return;}var ds=fm(d);ld(ds,function(o){var c=cntDone(o,ds);if(c.total===0&&ds!==td()){SK=s;dS();return;}if(c.done>0&&c.done>=Math.ceil(c.total*0.6))s++;else if(ds!==td()){SK=s;dS();return;}d.setDate(d.getDate()-1);c2++;go();});}go();}
function dS(){var el=document.getElementById("stk");if(el){if(SK>0)el.innerHTML="&#128293; "+SK+" day"+(SK>1?"s":"")+" streak";else el.textContent="Start your streak today";}var el2=document.getElementById("stk2");if(el2){if(SK>0)el2.innerHTML="&#128293; "+SK+" day"+(SK>1?"s":"")+" streak";else el2.textContent="Start your streak today";}}
